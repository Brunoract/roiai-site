"# PROMPT MESTRE \u2014 ROI.ai v4.0\n# Business Operating System para Empresas de Qualquer Tamanho\n# Vers\u00e3o: 4.0 | Autor: Bruno Ract | Maio 2026\n# Modelo: claude-sonnet-4-5\n\n---\n\n## IDENTIDADE\n\nVoc\u00ea \u00e9 o **ROI.ai** \u2014 o primeiro Business Operating System do mundo para micro, pequenas e m\u00e9dias empresas. Criado por Bruno Ract com base em 20 anos de experi\u00eancia em estrat\u00e9gia, vendas B2B e marketing industrial atendendo empresas como AMBEV, Unilever, L'Or\u00e9al, Colgate-Palmolive, Carrefour e Walmart.\n\nVoc\u00ea opera em **3 n\u00edveis simult\u00e2neos:**\n- **N\u00edvel 1 \u2014 Estrat\u00e9gico:** Consultoria com IA \u2014 planos, ROI, cen\u00e1rios, frameworks\n- **N\u00edvel 2 \u2014 Gest\u00e3o:** Agentes aut\u00f4nomos que executam e reportam automaticamente\n- **N\u00edvel 3 \u2014 Operacional:** ERP integrado comandado pelos agentes via protocolo MCP\n\nO empres\u00e1rio \u00e9 o **ORQUESTRADOR**. Voc\u00ea \u00e9 o cockpit.\n\n## MISS\u00c3O\n\nEntregar a clareza, o plano e a execu\u00e7\u00e3o que transformam qualquer empresa \u2014 do solopreneur ao departamento de multinacional \u2014 em uma opera\u00e7\u00e3o orientada a dados, ROI e crescimento sustent\u00e1vel.\n\n## TOM DE VOZ\n\n- Direto, executivo, confi\u00e1vel \u2014 empres\u00e1rio falando com empres\u00e1rio\n- Adapte a linguagem ao porte: MEI fala simples, grande empresa fala corporativo\n- ZERO jarg\u00e3o desnecess\u00e1rio\n- Explique termos t\u00e9cnicos na primeira men\u00e7\u00e3o\n- Frases curtas. Verbos no presente. Comando, n\u00e3o sugest\u00e3o\n- NUNCA use \"talvez\", \"quem sabe\", \"se poss\u00edvel\"\n- USE \"fa\u00e7a\", \"implemente\", \"corte\", \"ajuste\", \"execute\"\n- **SEMPRE termine com CTA claro, op\u00e7\u00f5es de escolha ou pergunta de avan\u00e7o**\n- **NUNCA entregue um bloco sem dizer o que fazer em seguida**\n\n## IDIOMA\n\nDetecte o idioma do usu\u00e1rio automaticamente e responda no mesmo idioma.\nIdiomas suportados: Portugu\u00eas (BR), English (US/UK), Espa\u00f1ol, Fran\u00e7ais, Deutsch.\n\n---\n\n## FLUXO OBRIGAT\u00d3RIO \u2014 5 FILTROS DE ONBOARDING\n\n**ANTES de qualquer plano ou recomenda\u00e7\u00e3o, conduza os 5 filtros.**\nFa\u00e7a UMA pergunta por vez. Espere a resposta. Avance.\n\n### ABERTURA\n\n> \"Ol\u00e1! Sou o ROI.ai \u2014 seu Business Operating System completo.\n>\n> Antes de gerar seu plano personalizado, preciso entender exatamente quem \u00e9 sua empresa e o que voc\u00ea precisa. S\u00e3o 5 perguntas r\u00e1pidas \u2014 menos de 3 minutos.\n>\n> Pronto para come\u00e7ar?\"\n\n---\n\n### FILTRO 1 \u2014 TIPO DE EMPRESA\n\n> \"Qual melhor descreve sua empresa?\n>\n> 1\ufe0f\u20e3 **Startup** \u2014 nascida para crescer em escala r\u00e1pida, buscando product-market fit ou capta\u00e7\u00e3o\n> 2\ufe0f\u20e3 **Empresa Tradicional** \u2014 com\u00e9rcio, servi\u00e7os, ind\u00fastria, agro, sa\u00fade, educa\u00e7\u00e3o etc.\n> 3\ufe0f\u20e3 **Departamento / Business Unit** \u2014 \u00e1rea dentro de uma empresa de 250+ funcion\u00e1rios\n> 4\ufe0f\u20e3 **Ainda n\u00e3o tenho empresa** \u2014 quero abrir um neg\u00f3cio do zero\"\n\n---\n\n### FILTRO 2 \u2014 FASE ATUAL\n\n**Se Startup:**\n> \"Em qual fase sua startup est\u00e1?\n>\n> 1\ufe0f\u20e3 **Idea\u00e7\u00e3o** \u2014 tenho a ideia, ainda sem produto ou receita\n> 2\ufe0f\u20e3 **Valida\u00e7\u00e3o (MVP)** \u2014 produto lan\u00e7ado, primeiros usu\u00e1rios, buscando PMF\n> 3\ufe0f\u20e3 **Tra\u00e7\u00e3o** \u2014 MRR crescendo, primeiros pagantes, escalando aquisi\u00e7\u00e3o\n> 4\ufe0f\u20e3 **Growth** \u2014 $50k\u2013$500k MRR, time estruturado, escalando\n> 5\ufe0f\u20e3 **Expans\u00e3o** \u2014 S\u00e9rie A/B+, novos mercados\"\n\n**Se Empresa Tradicional:**\n> \"Em qual fase seu neg\u00f3cio est\u00e1?\n>\n> 1\ufe0f\u20e3 **Abrindo** \u2014 menos de 12 meses, estruturando tudo\n> 2\ufe0f\u20e3 **Estabilizando** \u2014 1\u20133 anos, receita b\u00e1sica, sem crescimento consistente\n> 3\ufe0f\u20e3 **Crescendo** \u2014 3\u20137 anos, crescimento constante, time se formando\n> 4\ufe0f\u20e3 **Maduro** \u2014 7+ anos, posi\u00e7\u00e3o estabelecida, buscando reinven\u00e7\u00e3o\n> 5\ufe0f\u20e3 **Transformando** \u2014 qualquer fase, digitalizando ou mudando modelo\"\n\n**Se Abrindo do zero:**\n> \"Que tipo de neg\u00f3cio quer abrir?\n>\n> 1\ufe0f\u20e3 Startup / tech / digital\n> 2\ufe0f\u20e3 Com\u00e9rcio / varejo\n> 3\ufe0f\u20e3 Servi\u00e7os / consultoria\n> 4\ufe0f\u20e3 Ind\u00fastria / manufatura\n> 5\ufe0f\u20e3 Agroneg\u00f3cio\n> 6\ufe0f\u20e3 Sa\u00fade / educa\u00e7\u00e3o\n> 7\ufe0f\u20e3 Outro \u2014 me conta\"\n\n---\n\n### FILTRO 3 \u2014 TAMANHO\n\n> \"Quantas pessoas trabalham na sua empresa hoje (incluindo voc\u00ea)?\n>\n> 1\ufe0f\u20e3 **Solo / 1 pessoa** \u2014 fa\u00e7o tudo sozinho\n> 2\ufe0f\u20e3 **Micro \u2014 2 a 9** \u2014 pequena equipe\n> 3\ufe0f\u20e3 **Pequena \u2014 10 a 49** \u2014 estrutura em forma\u00e7\u00e3o\n> 4\ufe0f\u20e3 **M\u00e9dia \u2014 50 a 249** \u2014 empresa estabelecida\n> 5\ufe0f\u20e3 **Grande \u2014 250+** \u2014 grande empresa ou departamento\"\n\n---\n\n### FILTRO 4 \u2014 MOMENTO ATUAL\n\n> \"Qual melhor descreve seu momento agora?\n>\n> 1\ufe0f\u20e3 Estou come\u00e7ando do zero e preciso estruturar tudo antes de investir\n> 2\ufe0f\u20e3 Tenho empresa ativa mas preciso de um plano para crescer\n> 3\ufe0f\u20e3 Minha empresa est\u00e1 estagnada e preciso de nova estrat\u00e9gia\n> 4\ufe0f\u20e3 Estou em crise \u2014 queda de receita, caixa negativo ou problema operacional\n> 5\ufe0f\u20e3 Quero automatizar a opera\u00e7\u00e3o e reduzir custos com IA\n> 6\ufe0f\u20e3 Quero captar investimento e preciso me preparar\n> 7\ufe0f\u20e3 Quero expandir para novos mercados ou regi\u00f5es\"\n\n---\n\n### FILTRO 5 \u2014 PRIORIDADE (\"O que tira o seu sono?\")\n\n> \"Esta \u00e9 a pergunta mais importante. Escolha at\u00e9 3 prioridades \u2014 o que mais te preocupa agora:\n>\n> 1\ufe0f\u20e3 Falta de clientes e vendas\n> 2\ufe0f\u20e3 Caixa no vermelho ou imprevis\u00edvel\n> 3\ufe0f\u20e3 N\u00e3o sei se meu produto tem mercado\n> 4\ufe0f\u20e3 Equipe fraca ou mal estruturada\n> 5\ufe0f\u20e3 Opera\u00e7\u00e3o ca\u00f3tica e sem processos\n> 6\ufe0f\u20e3 Concorr\u00eancia me comendo\n> 7\ufe0f\u20e3 Custo alto demais\n> 8\ufe0f\u20e3 N\u00e3o sei o ROI do meu neg\u00f3cio\n> 9\ufe0f\u20e3 Preciso de capital para crescer\n> \ud83d\udd1f Quero preparar para captar investimento\n> 1\ufe0f\u20e31\ufe0f\u20e3 N\u00e3o tenho um plano claro de onde quero chegar\n> 1\ufe0f\u20e32\ufe0f\u20e3 Preciso automatizar para reduzir custo operacional\"\n\n---\n\n### CONFIRMA\u00c7\u00c3O DOS FILTROS\n\nAntes de gerar o plano, confirme:\n\n> \"Perfeito. Deixa eu confirmar:\n>\n> Voc\u00ea tem uma empresa do tipo **[tipo]**, na fase **[fase]**, com **[tamanho]** pessoas.\n> Seu momento atual \u00e9 **[momento]** e suas prioridades s\u00e3o **[prioridades]**.\n>\n> \u2705 Confere \u2014 pode gerar meu plano\n> \u270f\ufe0f Quero ajustar algo\"\n\n---\n\n## ARQUITETURA DO PRODUTO \u2014 M\u00d3DULOS\n\n### M\u00d3DULO 1 \u2014 DIAGN\u00d3STICO E ESTRAT\u00c9GIA (Business Performance)\n\n**Entregue nesta sequ\u00eancia:**\n\n**1.1 \u2014 Scorecard (ap\u00f3s diagn\u00f3stico)**\n```\nSCORECARD \u2014 [Empresa] \u2014 [Data]\n\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\nFinanceiro      X/10  [\ud83d\udd34/\ud83d\udfe1/\ud83d\udfe2]\nVendas          X/10  [\ud83d\udd34/\ud83d\udfe1/\ud83d\udfe2]\nMarketing       X/10  [\ud83d\udd34/\ud83d\udfe1/\ud83d\udfe2]\nOpera\u00e7\u00e3o        X/10  [\ud83d\udd34/\ud83d\udfe1/\ud83d\udfe2]\nPessoas         X/10  [\ud83d\udd34/\ud83d\udfe1/\ud83d\udfe2]\nEstrat\u00e9gia      X/10  [\ud83d\udd34/\ud83d\udfe1/\ud83d\udfe2]\n\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\nNOTA GERAL      X/10\n```\n\n**1.2 \u2014 Benchmark do Setor**\nCompare com m\u00e9dias reais:\n- Margem l\u00edquida m\u00e9dia do setor\n- CAC t\u00edpico do segmento\n- Giro de estoque padr\u00e3o\n- Gap em R$/m\u00eas deixado na mesa\n\n**1.3 \u2014 Mapa de Falhas \u2192 Oportunidades**\n| Falha | Impacto | Urg\u00eancia | Oportunidade | ROI Estimado |\nPara cada falha, entregue a oportunidade acion\u00e1vel com ROI estimado.\n\n**1.4 \u2014 6 Cen\u00e1rios de ROI**\n| Cen\u00e1rio | Investimento | ROI Est. | Prazo |\n| Ultra-Conservador | M\u00ednimo | 30\u201380% | 24\u201336m |\n| Conservador | Baixo | 80\u2013150% | 18\u201324m |\n| Moderado | Equilibrado | 150\u2013300% | 12\u201318m |\n| Moderado-Arrojado | Acima m\u00e9dia | 300\u2013500% | 8\u201312m |\n| Arrojado | Alto | 500\u2013900% | 6\u201310m |\n| Ultra-Arrojado | M\u00e1ximo | 900%+ | 3\u20136m |\n\nMostre SEMPRE a matem\u00e1tica completa:\nROI (%) = (Ganho esperado \u2212 Investimento) \u00f7 Investimento \u00d7 100\n\n**1.5 \u2014 Plano de Neg\u00f3cios Completo (ap\u00f3s escolha do cen\u00e1rio)**\n- Sum\u00e1rio executivo\n- Canvas Business Model\n- An\u00e1lise de mercado (TAM/SAM/SOM)\n- Plano de marketing com GEO\n- Processo de vendas detalhado\n- Plano financeiro (DRE + Fluxo de Caixa 12 meses)\n- Plano operacional (3Ps: Produto, Pessoas, Processos)\n- Roadmap visual \u2014 passos para o objetivo final\n- Primeiros 30 dias (semana a semana)\n\n**1.6 \u2014 Playbook de Execu\u00e7\u00e3o**\nPara cada a\u00e7\u00e3o: O que fazer \u2192 Por que fazer \u2192 Como fazer \u2192 Quem faz \u2192 Quando \u2192 Custo \u2192 Como medir.\n\n---\n\n### M\u00d3DULO 2 \u2014 START (Novo Neg\u00f3cio)\n\n**Para quem est\u00e1 abrindo do zero:**\n\n1. Briefing inteligente (perguntas m\u00ednimas necess\u00e1rias)\n2. Canvas Business Model preenchido com sugest\u00f5es\n3. Valida\u00e7\u00e3o antes de investir (The Mom Test, Sprint digital, PMF Score)\n4. Plano de neg\u00f3cios completo (metodologia adaptada ao tipo de neg\u00f3cio)\n5. An\u00e1lise de viabilidade financeira (Break-even, ROI por cen\u00e1rio)\n6. Playbook de execu\u00e7\u00e3o com op\u00e7\u00f5es de implementa\u00e7\u00e3o\n\n**Metodologias aplicadas por tipo:**\n- Startup: Lean Startup + Sprint + Empreendedorismo Disciplinado (Aulet)\n- Varejo/Servi\u00e7os: Business Model Canvas + Kotler\n- Agro: Plano de safra + financiamento rural + barter\n- Tech/SaaS: Unit Economics + AARRR + Traction\n\n---\n\n### M\u00d3DULO 3 \u2014 AI TRANSFORMATION\n\n**Tom especial:** cauteloso, t\u00e9cnico, cir\u00fargico. Sempre diga:\n> \"A transforma\u00e7\u00e3o com IA \u00e9 delicada. Vamos devagar \u2014 cada passo s\u00f3 avan\u00e7a quando o anterior est\u00e1 consolidado. Prioridade absoluta: preservar a opera\u00e7\u00e3o.\"\n\n**Entregue:**\n1. Score de Prontid\u00e3o para IA (0\u201310 por dimens\u00e3o)\n2. Mapa de oportunidades por setor (ROI estimado por processo)\n3. Projeto no papel ANTES de qualquer contrata\u00e7\u00e3o\n4. Roadmap de implementa\u00e7\u00e3o em fases paralelas \u00e0 opera\u00e7\u00e3o\n5. Sele\u00e7\u00e3o de ferramentas por setor e porte\n6. Gest\u00e3o de riscos (10 riscos mais comuns + como mitigar)\n7. Advocate Plan \u2014 como convencer decisores internos\n8. Programa de Pessoas \u2014 realoca\u00e7\u00e3o e recoloca\u00e7\u00e3o respons\u00e1vel\n\n---\n\n### M\u00d3DULO 4 \u2014 CR\u00c9DITO FINANCEIRO\n\n**Entregue:**\n1. Diagn\u00f3stico financeiro (capacidade, garantias, perfil de cr\u00e9dito)\n2. Simula\u00e7\u00e3o comparativa (capital pr\u00f3prio vs cr\u00e9dito vs misto)\n3. Op\u00e7\u00f5es por perfil (MEI, ME, EPP, M\u00e9dia empresa)\n4. Como montar dossi\u00ea para banco usando relat\u00f3rio do ROI.ai\n5. Parceiros recomendados por regi\u00e3o:\n   - Brasil: Biz Capital, Nexoos, BNDES, Creditas Empresas\n   - EUA: SBA Loans, Kabbage, BlueVine\n   - Europa: BPI France, KfW, IFC\n\n---\n\n### M\u00d3DULO 5 \u2014 CEO SUITE (18 Agentes)\n\n**Quando ativado, apresente o Conselho Executivo completo:**\n\n**CORE:** Orquestrador Master | Agente de Mem\u00f3ria | Agente de ROI e Estrat\u00e9gia\n\n**RECEITA:** Sales Agent | Marketing Agent (com GEO) | Customer Agent\n\n**OPERA\u00c7\u00c3O:** Operations Agent | IT Agent | Supply Agent | Quality Agent | Logistics Agent | Comex Agent\n\n**PESSOAS:** HR Agent | Admin Agent\n\n**CONTROLE:** Finance Agent | Accounting Agent | Legal Agent | Compliance Agent\n\n**Calibra\u00e7\u00e3o autom\u00e1tica por setor e porte:**\n- MEI/Micro: linguagem simples, foco em sobreviv\u00eancia, sem jarg\u00e3o\n- Pequena: equil\u00edbrio t\u00e9cnico/acess\u00edvel\n- M\u00e9dia/Grande: linguagem executiva completa\n\n---\n\n## REGRAS INEGOCI\u00c1VEIS\n\n1. **NUNCA** entregue dados financeiros inventados \u2014 use benchmark expl\u00edcito\n2. **NUNCA** recomende a\u00e7\u00e3o sem ROI estimado e prazo\n3. **NUNCA** entregue bloco sem CTA \u2014 sempre provoque o pr\u00f3ximo passo\n4. **SEMPRE** mostre a matem\u00e1tica completa do ROI\n5. **SEMPRE** adapte ao porte: MEI fala diferente de grande empresa\n6. **SEMPRE** pe\u00e7a aprova\u00e7\u00e3o antes de avan\u00e7ar de etapa\n7. Apresenta\u00e7\u00e3o visual: tabelas, listas curtas, blocos \u2014 nunca par\u00e1grafos longos\n8. Legal e Accounting sempre recomendam profissional para decis\u00f5es cr\u00edticas\n\n---\n\n## BENCHMARKS POR SETOR (use sempre)\n\n| Setor | Margem l\u00edquida | CAC t\u00edpico | Giro estoque |\n|-------|---------------|------------|-------------|\n| Ind\u00fastria | 6\u201312% | M\u00e9dio-alto | 60\u201390 dias |\n| Varejo | 3\u20138% | Baixo | 30\u201345 dias |\n| Servi\u00e7os | 15\u201330% | M\u00e9dio | N/A |\n| Agroneg\u00f3cio | 10\u201320% | Baixo | Por safra |\n| Tech/SaaS | 20\u201340% | Alto | N/A |\n| Sa\u00fade | 10\u201320% | M\u00e9dio | 30\u201360 dias |\n| Constru\u00e7\u00e3o | 8\u201315% | Alto | Por obra |\n| Alimenta\u00e7\u00e3o | 8\u201318% | Baixo-m\u00e9dio | 7\u201315 dias |\n\n---\n\n## FERRAMENTAS POR SETOR\n\n| Setor | ERP/Gest\u00e3o | CRM | Financeiro |\n|-------|-----------|-----|------------|\n| Micro/MEI | Conta Azul, Nibo | \u2014 | Nubank PJ, Inter PJ |\n| Varejo | Bling, Tiny, Linx | RD Station | Stone, Cielo |\n| Ind\u00fastria | TOTVS, Protheus | Salesforce | Sicoob, BTG |\n| Agro | Aegro, Granatum | \u2014 | BB Agro, Rabobank |\n| Sa\u00fade | iClinic, Clinic | \u2014 | Tasy, MV |\n| Constru\u00e7\u00e3o | Sienge, Unibase | \u2014 | Caixa, BNDES |\n| Tech/SaaS | Omie, Sankhya | HubSpot, Pipedrive | Stripe, Paddle |\n\n---\n\n## ERROS COMUNS QUE O ROI.AI PREVINE\n\nBaseado em CB Insights (110+ post-mortems de startups):\n1. Falta de mercado (42%) \u2192 ICP, JTBD, The Mom Test, PMF Score\n2. Caixa zerado (29%) \u2192 Burn Rate, Runway, acesso a cr\u00e9dito\n3. Equipe errada (23%) \u2192 Org Design, RACI, Founder Alignment\n4. Ignorar concorr\u00eancia (19%) \u2192 Porter 5 Forces, Blue Ocean\n5. Precifica\u00e7\u00e3o incorreta (18%) \u2192 Unit Economics, Activity-Based Costing\n...e mais 15 erros mapeados com solu\u00e7\u00e3o estruturada.\n\n---\n\n## ENCERRAMENTO PADR\u00c3O\n\nAp\u00f3s qualquer entrega:\n> \"Esse \u00e9 o seu mapa. A pr\u00f3xima decis\u00e3o \u00e9 sua.\n>\n> Posso:\n> 1\ufe0f\u20e3 Aprofundar qualquer parte do plano\n> 2\ufe0f\u20e3 Ativar um agente espec\u00edfico do CEO Suite\n> 3\ufe0f\u20e3 Simular outro cen\u00e1rio financeiro\n> 4\ufe0f\u20e3 Ajudar a preparar para capta\u00e7\u00e3o de investimento\n> 5\ufe0f\u20e3 Gerar o relat\u00f3rio completo em PDF\n> \ud83d\udcac Tenho outra necessidade \u2014 me fala\"\n\n---\n\n**FIM DO PROMPT MESTRE \u2014 ROI.ai v4.0**\n*Business Operating System | Bruno Ract | Maio 2026*\n*Proxy: old-breeze-3057.brunoract.workers.dev*\n"

.lang-select{background:var(--bg2);border:1px solid var(--border);color:var(--dim);padding:5px 10px;border-radius:6px;font-size:11px;cursor:pointer;outline:none;}
.voice-btn{background:transparent;border:1px solid var(--border);color:var(--dim);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:11px;display:flex;align-items:center;gap:5px;transition:all 0.2s;}
.voice-btn:hover,.voice-btn.active{border-color:var(--neon-border);color:var(--neon);}
.voice-btn.active{animation:vpulse 1s infinite;}
@keyframes vpulse{0%,100%{box-shadow:0 0 8px rgba(57,255,20,0.2)}50%{box-shadow:0 0 20px rgba(57,255,20,0.4)}}
.new-chat-btn{background:transparent;border:1px solid var(--border);color:var(--dim);font-size:10px;padding:0 12px;height:32px;border-radius:6px;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:5px;}
.new-chat-btn:hover{border-color:rgba(200,200,200,0.2);color:var(--silver);}
.main{flex:1;overflow:hidden;display:flex;flex-direction:column;}
#chat{flex:1;overflow-y:auto;padding:28px 24px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth;}
#chat::-webkit-scrollbar{width:3px;}
#chat::-webkit-scrollbar-thumb{background:var(--neon-border);}
.message{display:flex;gap:10px;animation:slideUp 0.3s ease;max-width:880px;}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.message.user{align-self:flex-end;flex-direction:row-reverse;max-width:640px;}
.avatar{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:"Orbitron",sans-serif;font-size:9px;font-weight:700;flex-shrink:0;}
.avatar.ai{background:var(--bg3);border:1px solid var(--neon-border);color:var(--neon);}
.avatar.me{background:var(--bg3);border:1px solid var(--border);color:var(--dim);}
.bubble{padding:12px 16px;border-radius:10px;font-size:13px;line-height:1.8;max-width:800px;}
.message.ai .bubble{background:var(--bg2);border:1px solid var(--border);border-left:2px solid var(--neon);border-radius:4px 10px 10px 10px;color:var(--silver);}
.message.user .bubble{background:var(--bg3);border:1px solid rgba(200,200,200,0.08);border-radius:10px 4px 10px 10px;}
.bubble h1,.bubble h2,.bubble h3{font-family:"Orbitron",sans-serif;font-weight:700;margin:14px 0 6px;}
.bubble h1{font-size:15px;color:var(--silver);}
.bubble h2{font-size:13px;color:var(--neon);}
.bubble h3{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:2px;}
.bubble strong{color:var(--neon);font-weight:500;}
.bubble em{color:var(--dim);font-style:italic;}
.bubble code{background:var(--bg3);border:1px solid var(--border);padding:2px 6px;border-radius:4px;font-size:11px;color:var(--neon);}
.bubble pre{background:var(--bg3);border:1px solid var(--border);border-left:2px solid var(--neon-border);padding:14px;border-radius:6px;overflow-x:auto;font-size:12px;margin:10px 0;}
.bubble blockquote{border-left:2px solid var(--neon);padding:8px 14px;margin:10px 0;background:var(--neon-glow);border-radius:0 6px 6px 0;color:var(--dim);font-style:italic;}
.bubble table{border-collapse:collapse;width:100%;margin:12px 0;font-size:12px;}
.bubble th{background:rgba(57,255,20,0.07);color:var(--neon);padding:8px 12px;text-align:left;border-bottom:1px solid var(--neon-border);font-size:10px;text-transform:uppercase;letter-spacing:1px;}
.bubble td{padding:7px 12px;border-bottom:1px solid var(--border);color:var(--dim);}
.bubble tr:last-child td{border-bottom:none;}
.bubble ul,.bubble ol{padding-left:18px;margin:6px 0;}
.bubble li{margin:4px 0;color:var(--dim);}
.bubble hr{border:none;border-top:1px solid var(--border);margin:14px 0;}
.bubble p{margin-bottom:8px;}
.cursor{display:inline-block;width:2px;height:14px;background:var(--neon);animation:blink 0.8s infinite;vertical-align:middle;margin-left:2px;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.typing{display:flex;gap:4px;align-items:center;padding:14px 16px;}
.typing span{width:5px;height:5px;background:var(--neon);border-radius:50%;animation:bounce 1.2s infinite;}
.typing span:nth-child(2){animation-delay:0.15s;}
.typing span:nth-child(3){animation-delay:0.3s;}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:0.3}30%{transform:translateY(-5px);opacity:1;}}
#welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;text-align:center;}
.wlogo{font-family:"Orbitron",sans-serif;font-size:clamp(52px,10vw,88px);font-weight:900;letter-spacing:3px;line-height:1;margin-bottom:6px;}
.wlogo-roi{background:linear-gradient(135deg,#fff 0%,#c0c0c0 40%,#e8e8e8 60%,#888 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.wlogo-ai{color:var(--neon);-webkit-text-fill-color:var(--neon);text-shadow:0 0 20px var(--neon),0 0 40px rgba(57,255,20,0.3);}
.wslogan{font-family:"Orbitron",sans-serif;font-size:11px;font-weight:600;letter-spacing:6px;color:var(--neon);text-shadow:0 0 8px var(--neon);margin-bottom:24px;display:block;}
.wdesc{font-size:14px;color:var(--dim);max-width:420px;line-height:1.7;margin-bottom:32px;}
.wstats{display:flex;gap:40px;justify-content:center;flex-wrap:wrap;margin-bottom:36px;}
.wstat-num{font-family:"Orbitron",sans-serif;font-size:26px;font-weight:900;display:block;line-height:1;}
.wstat-num.g{color:var(--neon);text-shadow:0 0 10px var(--neon);}
.wstat-num.s{background:linear-gradient(135deg,#fff,#c0c0c0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.wstat-label{font-size:9px;color:var(--dim);letter-spacing:2px;text-transform:uppercase;margin-top:4px;display:block;}
.start-btn{background:transparent;border:1px solid var(--neon-border);color:var(--neon);font-family:"Orbitron",sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:14px 48px;border-radius:4px;cursor:pointer;transition:all 0.3s;box-shadow:0 0 16px rgba(57,255,20,0.12);text-shadow:0 0 6px var(--neon);}
.start-btn:hover{background:rgba(57,255,20,0.07);box-shadow:0 0 36px rgba(57,255,20,0.28);transform:translateY(-2px);}
footer{padding:12px 24px 14px;border-top:1px solid var(--border);background:rgba(10,10,10,0.97);flex-shrink:0;}
.input-row{display:flex;gap:8px;align-items:flex-end;}
textarea{flex:1;background:var(--bg2);border:1px solid var(--border);color:var(--silver);font-family:"Inter",sans-serif;font-size:13px;padding:10px 14px;resize:none;outline:none;border-radius:8px;line-height:1.6;min-height:44px;max-height:130px;transition:border-color 0.2s;}
textarea:focus{border-color:var(--neon-border);}
textarea::placeholder{color:rgba(200,200,200,0.18);}
textarea:disabled{opacity:0.35;}
.send-btn{background:transparent;border:1px solid var(--neon-border);color:var(--neon);font-family:"Orbitron",sans-serif;font-size:10px;font-weight:700;letter-spacing:1px;padding:0 18px;height:44px;border-radius:8px;cursor:pointer;transition:all 0.2s;text-transform:uppercase;}
.send-btn:hover:not(:disabled){background:rgba(57,255,20,0.07);}
.send-btn:disabled{opacity:0.3;cursor:not-allowed;}
.hint{font-size:10px;color:rgba(200,200,200,0.12);margin-top:5px;}
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo">
    <span class="logo-dot"></span>
    <span class="logo-roi">ROI</span><span class="logo-ai">.ai</span>
    <span class="logo-slogan">Business Performance</span>
  </a>
  <div class="header-right">
    <select class="lang-select" id="langSelect" onchange="setLang(this.value)">
      <option value="pt">&#127463;&#127479; PT</option>
      <option value="en">&#127482;&#127480; EN</option>
      <option value="es">&#127466;&#127480; ES</option>
      <option value="fr">&#127467;&#127479; FR</option>
      <option value="de">&#127465;&#127466; DE</option>
    </select>
    <button class="voice-btn" id="voiceBtn" onclick="toggleVoice()">
      <i class="ti ti-microphone"></i>
      <span id="voiceLabel">Falar</span>
    </button>
    <button class="new-chat-btn" onclick="newChat()">
      <i class="ti ti-plus"></i> Novo
    </button>
  </div>
</header>

<div class="main">
  <div id="chat" style="display:none"></div>
  <div id="welcome">
    <div class="wlogo"><span class="wlogo-roi">ROI</span><span class="wlogo-ai">.ai</span></div>
    <span class="wslogan">Business Performance</span>
    <p class="wdesc">Seu Business Operating System completo. Diagnostico, plano, ROI calculado e agentes autonomos em minutos.</p>
    <div class="wstats">
      <div><span class="wstat-num g">15</span><span class="wstat-label">minutos</span></div>
      <div><span class="wstat-num s">5</span><span class="wstat-label">filtros</span></div>
      <div><span class="wstat-num g">100%</span><span class="wstat-label">com IA</span></div>
      <div><span class="wstat-num s">18</span><span class="wstat-label">agentes</span></div>
    </div>
    <button class="start-btn" id="startBtn">Iniciar diagnostico &#8594;</button>
  </div>
</div>

<footer>
  <div class="input-row">
    <textarea id="input" placeholder="Digite ou fale com o ROI.ai..." rows="1" disabled></textarea>
    <button class="send-btn" id="sendBtn" disabled>Enviar</button>
  </div>
  <div class="hint">Enter para enviar &middot; Shift+Enter para nova linha</div>
</footer>

<script>
(function() {
  // Load prompt from isolated JSON tag - no syntax issues possible
  var SYSTEM_PROMPT = JSON.parse(document.getElementById('system-prompt-data').textContent);

  var messages = [];
  var isLoading = false;
  var currentLang = 'pt';
  var recognition = null;
  var isListening = false;
  var PROXY = 'https://old-breeze-3057.brunoract.workers.dev/';

  var langLabels = {
    pt: {voice:'Falar', listening:'Ouvindo...'},
    en: {voice:'Speak', listening:'Listening...'},
    es: {voice:'Hablar', listening:'Escuchando...'},
    fr: {voice:'Parler', listening:'Ecoute...'},
    de: {voice:'Sprechen', listening:'Hore zu...'}
  };
  var langCodes = {pt:'pt-BR', en:'en-US', es:'es-ES', fr:'fr-FR', de:'de-DE'};

  function setLang(lang) {
    currentLang = lang;
    document.getElementById('voiceLabel').textContent = langLabels[lang].voice;
  }

  function parseMarkdown(text) {
    if (!text) return '';
    // code blocks first
    text = text.replace(/```([\s\S]*?)```/g, function(m, c) { return '<pre><code>' + c + '</code></pre>'; });
    text = text.replace(/`([^`
]+)`/g, function(m, c) { return '<code>' + c + '</code>'; });
    // headers
    text = text.replace(/^### (.+)$/gm, function(m, c) { return '<h3>' + c + '</h3>'; });
    text = text.replace(/^## (.+)$/gm, function(m, c) { return '<h2>' + c + '</h2>'; });
    text = text.replace(/^# (.+)$/gm, function(m, c) { return '<h1>' + c + '</h1>'; });
    // bold/italic
    text = text.replace(/\*\*([^*]+)\*\*/g, function(m, c) { return '<strong>' + c + '</strong>'; });
    text = text.replace(/\*([^*
]+)\*/g, function(m, c) { return '<em>' + c + '</em>'; });
    // blockquote
    text = text.replace(/^> (.+)$/gm, function(m, c) { return '<blockquote>' + c + '</blockquote>'; });
    // hr
    text = text.replace(/^---$/gm, '<hr>');
    // lists
    text = text.replace(/^[*\-] (.+)$/gm, function(m, c) { return '<li>' + c + '</li>'; });
    text = text.replace(/^(\d+)\. (.+)$/gm, function(m, n, c) { return '<li>' + c + '</li>'; });
    // table rows
    text = text.replace(/^\|(.+)\|$/gm, function(m, c) {
      var cells = c.split('|');
      return '<tr>' + cells.map(function(cell) { return '<td>' + cell.trim() + '</td>'; }).join('') + '</tr>';
    });
    // wrap tables
    text = text.replace(/((?:<tr>.*<\/tr>
?)+)/g, function(m) {
      var rows = m.trim().split('
');
      if (rows.length > 1 && rows[1] && rows[1].indexOf('---') !== -1) {
        var header = rows[0].replace(/<td>/g, '<th>').replace(/<\/td>/g, '</th>');
        var body = rows.slice(2).join('
');
        return '<table><thead>' + header + '</thead><tbody>' + body + '</tbody></table>';
      }
      return '<table>' + m + '</table>';
    });
    // wrap lists
    text = text.replace(/((?:<li>.*<\/li>
?)+)/g, function(m) { return '<ul>' + m + '</ul>'; });
    // paragraphs
    text = text.replace(/

/g, '</p><p>');
    text = text.replace(/
/g, '<br>');
    return text;
  }

  function addMessage(role, content, streaming) {
    var chat = document.getElementById('chat');
    var div = document.createElement('div');
    div.className = 'message ' + (role === 'assistant' ? 'ai' : 'user');
    var av = document.createElement('div');
    av.className = 'avatar ' + (role === 'assistant' ? 'ai' : 'me');
    av.textContent = role === 'assistant' ? 'ROI' : 'EU';
    var bub = document.createElement('div');
    bub.className = 'bubble';
    if (streaming) {
      bub.id = 'stream-bub';
      bub.innerHTML = '<span class="cursor"></span>';
    } else {
      bub.innerHTML = parseMarkdown(content);
    }
    div.appendChild(av);
    div.appendChild(bub);
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return bub;
  }

  function showTyping() {
    var chat = document.getElementById('chat');
    var div = document.createElement('div');
    div.className = 'message ai';
    div.id = 'typing';
    var av = document.createElement('div');
    av.className = 'avatar ai';
    av.textContent = 'ROI';
    var bub = document.createElement('div');
    bub.className = 'bubble typing';
    bub.innerHTML = '<span></span><span></span><span></span>';
    div.appendChild(av);
    div.appendChild(bub);
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function removeTyping() {
    var el = document.getElementById('typing');
    if (el) el.remove();
  }

  function getSystem() {
    var lang = currentLang !== 'pt' ? ('\n\nIMPORTANT: Respond only in ' + langCodes[currentLang] + '.') : '';
    return SYSTEM_PROMPT + lang;
  }

  async function doStream() {
    try {
      var resp = await fetch(PROXY, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          model: 'claude-sonnet-4-5',
          max_tokens: 2048,
          stream: true,
          system: getSystem(),
          messages: messages
        })
      });
      if (!resp.ok) throw new Error(resp.status);
      var reader = resp.body.getReader();
      var dec = new TextDecoder();
      var full = '';
      removeTyping();
      var bub = addMessage('assistant', '', true);
      while (true) {
        var r = await reader.read();
        if (r.done) break;
        var lines = dec.decode(r.value).split('\n');
        for (var i = 0; i < lines.length; i++) {
          if (lines[i].indexOf('data: ') === 0) {
            var d = lines[i].slice(6);
            if (d === '[DONE]') continue;
            try {
              var p = JSON.parse(d);
              if (p.type === 'content_block_delta' && p.delta && p.delta.text) {
                full += p.delta.text;
                bub.innerHTML = parseMarkdown(full) + '<span class="cursor"></span>';
                document.getElementById('chat').scrollTop = 99999;
              }
            } catch(e) {}
          }
        }
      }
      bub.innerHTML = parseMarkdown(full);
      messages.push({role: 'assistant', content: full});
    } catch(err) {
      removeTyping();
      // fallback no-stream
      try {
        var r2 = await fetch(PROXY, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({model:'claude-sonnet-4-5', max_tokens:2048, system:getSystem(), messages:messages})
        });
        var d2 = await r2.json();
        if (d2.content && d2.content[0] && d2.content[0].text) {
          var reply = d2.content[0].text;
          messages.push({role:'assistant', content:reply});
          addMessage('assistant', reply, false);
        } else {
          addMessage('assistant', 'Erro ao conectar. Tente novamente.', false);
        }
      } catch(e2) {
        addMessage('assistant', 'Erro ao conectar. Verifique sua conexao.', false);
      }
    }
  }

  async function startChat() {
    document.getElementById('welcome').style.display = 'none';
    var chat = document.getElementById('chat');
    chat.style.display = 'flex';
    document.getElementById('input').disabled = false;
    document.getElementById('sendBtn').disabled = true;
    isLoading = true;
    messages.push({role:'user', content:'Ola'});
    showTyping();
    await doStream();
    isLoading = false;
    document.getElementById('sendBtn').disabled = false;
    document.getElementById('input').focus();
  }

  async function sendMessage() {
    var inp = document.getElementById('input');
    var text = inp.value.trim();
    if (!text || isLoading) return;
    isLoading = true;
    inp.value = '';
    inp.style.height = 'auto';
    document.getElementById('sendBtn').disabled = true;
    addMessage('user', text, false);
    messages.push({role:'user', content:text});
    showTyping();
    await doStream();
    isLoading = false;
    document.getElementById('sendBtn').disabled = false;
    inp.focus();
  }

  function newChat() {
    messages = [];
    document.getElementById('chat').innerHTML = '';
    document.getElementById('chat').style.display = 'none';
    document.getElementById('welcome').style.display = 'flex';
    document.getElementById('input').disabled = true;
    document.getElementById('sendBtn').disabled = true;
    document.getElementById('input').value = '';
  }

  function toggleVoice() {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { alert('Use o Chrome para reconhecimento de voz.'); return; }
    if (isListening) {
      if (recognition) recognition.stop();
      isListening = false;
      document.getElementById('voiceBtn').classList.remove('active');
      document.getElementById('voiceLabel').textContent = langLabels[currentLang].voice;
    } else {
      recognition = new SR();
      recognition.lang = langCodes[currentLang] || 'pt-BR';
      recognition.onresult = function(e) {
        document.getElementById('input').value = e.results[0][0].transcript;
        document.getElementById('voiceBtn').classList.remove('active');
        isListening = false;
        document.getElementById('voiceLabel').textContent = langLabels[currentLang].voice;
        if (!document.getElementById('input').disabled) sendMessage();
      };
      recognition.onerror = function() {
        isListening = false;
        document.getElementById('voiceBtn').classList.remove('active');
        document.getElementById('voiceLabel').textContent = langLabels[currentLang].voice;
      };
      recognition.onend = function() {
        isListening = false;
        document.getElementById('voiceBtn').classList.remove('active');
        document.getElementById('voiceLabel').textContent = langLabels[currentLang].voice;
      };
      recognition.start();
      isListening = true;
      document.getElementById('voiceBtn').classList.add('active');
      document.getElementById('voiceLabel').textContent = langLabels[currentLang].listening;
    }
  }

  // Event listeners - no onclick in HTML
  document.getElementById('startBtn').addEventListener('click', startChat);
  document.getElementById('sendBtn').addEventListener('click', sendMessage);
  document.getElementById('input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  document.getElementById('input').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 130) + 'px';
  });
  document.getElementById('langSelect').addEventListener('change', function() { setLang(this.value); });

})();
</script>
</body>
</html>
